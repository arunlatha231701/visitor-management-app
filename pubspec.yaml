
name: visitor_management_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  riverpod: ^3.4.3
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  app_settings: ^9.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#172B4D"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.png
    - assets/app_icon_foreground.png
